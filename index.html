<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề Ôn Tập Trắc Nghiệm Vật Lý 12 - Thầy Vinh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-atom text-yellow-300"></i> ÔN TẬP VẬT LÝ 12
                </h1>
                <p class="text-xs md:text-sm text-indigo-200">THPT: Vinh VIP - Giáo Sư Vinh</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-indigo-800/80 px-3 py-1.5 rounded-lg border border-indigo-400/30 text-sm flex items-center gap-2">
                    <i class="fa-regular fa-clock text-yellow-300"></i>
                    <span id="timer" class="font-mono font-bold text-yellow-300 text-base">45:00</span>
                </div>
                <button onclick="submitQuiz()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-4 py-1.5 rounded-lg shadow transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-check"></i> Nộp Bài
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">
        <!-- Banner kết quả -->
        <div id="resultBanner" class="hidden mb-6 bg-white rounded-2xl shadow-md p-6 border-2 border-indigo-500">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Kết Quả Bài Làm</h2>
                    <p class="text-slate-600 mt-1">Đã chấm điểm tự động và kèm lời giải chi tiết!</p>
                </div>
                <div class="text-center md:text-right">
                    <div id="scoreDisplay" class="text-4xl font-extrabold text-indigo-600">0 / 10</div>
                    <p id="scoreDetail" class="text-sm font-medium text-slate-500 mt-1">Đúng 0 / 33 ý</p>
                </div>
            </div>
        </div>

        <form id="quizForm" onsubmit="return false;">
            <!-- PHẦN I -->
            <section class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-slate-200">
                <div class="border-b pb-3 mb-6">
                    <h2 class="text-lg font-bold text-indigo-700 uppercase flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full">Phần I</span>
                        Trắc nghiệm nhiều phương án lựa chọn (20 câu)
                    </h2>
                </div>
                <div id="part1" class="space-y-6"></div>
            </section>

            <!-- PHẦN II -->
            <section class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-slate-200">
                <div class="border-b pb-3 mb-6">
                    <h2 class="text-lg font-bold text-indigo-700 uppercase flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full">Phần II</span>
                        Trắc nghiệm Đúng / Sai (2 câu lớn - 8 ý nhỏ)
                    </h2>
                </div>
                <div id="part2" class="space-y-6"></div>
            </section>

            <!-- PHẦN III -->
            <section class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-slate-200">
                <div class="border-b pb-3 mb-6">
                    <h2 class="text-lg font-bold text-indigo-700 uppercase flex items-center gap-2">
                        <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full">Phần III</span>
                        Bài tập tính toán (Bộ số mới)
                    </h2>
                </div>
                <div id="part3" class="space-y-6"></div>
            </section>

            <div class="text-center py-4">
                <button type="button" onclick="submitQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-10 py-3.5 rounded-xl shadow-lg transition text-lg">
                    <i class="fa-solid fa-paper-plane mr-2"></i> HOÀN THÀNH VÀ NỘP BÀI
                </button>
            </div>
        </form>
    </main>

    <script>
        const dataPart1 = [
            { id: 1, q: "Trong thang nhiệt Celsius, nhiệt độ của nước đang sôi là bao nhiêu?", opts: ["273 K", "100 °C", "0 K", "0 °C"], ans: 1 },
            { id: 2, q: "Chất rắn vô định hình có đặc điểm và tính chất là:", opts: ["có tính dị hướng.", "có cấu trúc tinh thể.", "có dạng hình học xác định.", "có nhiệt độ nóng chảy không xác định."], ans: 3 },
            { id: 3, q: "Vật nào sau đây KHÔNG có cấu trúc tinh thể?", opts: ["Chiếc cốc thủy tinh.", "Hạt muối ăn.", "Viên kim cương.", "Miếng thạch anh."], ans: 0 },
            { id: 4, q: "Hiện tượng vào mùa đông ở các nước vùng băng tuyết thường xảy ra sự cố vỡ đường ống nước là do:", opts: ["tuyết rơi nhiều đè nặng thành ống.", "nước trong ống đóng băng nở ra gây áp lực lớn làm vỡ ống.", "nhiệt độ giảm làm ống co lại đột ngột.", "không khí trong ống giãn nở gây nổ."], ans: 1 },
            { id: 5, q: "Nội năng của một vật là:", opts: ["tổng động năng và thế năng của vật.", "tổng động năng và thế năng của các phân tử cấu tạo nên vật.", "tổng nhiệt lượng và cơ năng mà vật nhận được.", "nhiệt lượng vật nhận được trong quá trình truyền nhiệt."], ans: 1 },
            { id: 6, q: "Đơn vị nào sau đây KHÔNG phải là đơn vị của nhiệt lượng?", opts: ["J", "kJ", "calo", "N/m²"], ans: 3 },
            { id: 7, q: "Trong công thức tính nhiệt lượng thu vào: Q = m·c·Δt = m·c(t₂ - t₁), thì t₂ là:", opts: ["Nhiệt độ lúc đầu của vật.", "Nhiệt độ lúc sau của vật.", "Thời gian đun nóng vật.", "Độ biến thiên nhiệt độ."], ans: 1 },
            { id: 8, q: "Chọn phương án SAI:", opts: ["Nhiệt lượng của vật phụ thuộc vào khối lượng, độ tăng nhiệt độ và nhiệt dung riêng.", "Khối lượng của vật càng lớn thì nhiệt lượng thu vào để nóng lên càng lớn.", "Độ tăng nhiệt độ của vật càng lớn thì nhiệt lượng thu vào để nóng lên càng nhỏ.", "Cùng một khối lượng và độ tăng nhiệt độ, vật có nhiệt dung riêng lớn hơn thu nhiệt lượng lớn hơn."], ans: 2 },
            { id: 9, q: "Nhiệt dung riêng có đơn vị là:", opts: ["Jun (J).", "Jun trên Kilôgam (J/kg).", "Jun trên Kilôgam độ (J/kg·K).", "Jun trên độ (J/K)."], ans: 2 },
            { id: 10, q: "Bản tin dự báo thời tiết Nghệ An: 'Nhiệt độ từ 20 °C đến 29 °C'. Nhiệt độ trên tương ứng với nhiệt độ nào trong thang nhiệt Kelvin?", opts: ["Nhiệt độ từ 293 K đến 302 K.", "Nhiệt độ từ 20 K đến 29 K.", "Nhiệt độ từ -253 K đến -244 K.", "Nhiệt độ từ 273 K đến 292 K."], ans: 0 },
            { id: 11, q: "Cách đổi nhiệt độ từ thang nhiệt Celsius sang nhiệt Kelvin nào sau đây là đúng?", opts: ["T(K) = t(°C) + 273", "t(°C) = T(K) - 273", "T(K) = t(°C) + 32", "T(K) = 1.8 · t(°C) + 32"], ans: 0 },
            { id: 12, q: "Nhiệt dung riêng của một chất cho biết:", opts: ["nhiệt lượng cần cung cấp để chất đó nóng lên.", "nhiệt lượng cần cung cấp để chất đó nóng lên thêm 1 °C.", "nhiệt lượng cần cung cấp để 1 kg chất đó nóng lên thêm 1 °C.", "nhiệt lượng cần cung cấp để 1 g chất đó nóng lên thêm 1 °C."], ans: 2 },
            { id: 13, q: "Gọi t là nhiệt độ lúc sau, t₀ là nhiệt độ lúc đầu của vật. Công thức tính nhiệt lượng mà vật thu vào là:", opts: ["Q = m(t - t₀)", "Q = mc(t₀ - t)", "Q = mc", "Q = mc(t - t₀)"], ans: 3 },
            { id: 14, q: "Vật (chất) nào dưới đây có nhiệt độ nóng chảy xác định?", opts: ["Miếng nhựa thông", "Hạt đường", "Nhựa đường", "Miếng cao su"], ans: 1 },
            { id: 15, q: "Đơn vị của nhiệt nóng chảy riêng là:", opts: ["J", "J/kg·độ", "J/kg", "kg/J"], ans: 2 },
            { id: 16, q: "Gọi Q là nhiệt lượng cần truyền cho vật khối lượng m để làm vật nóng chảy hoàn toàn ở nhiệt độ nóng chảy. Nhiệt nóng chảy riêng là λ, công thức đúng là:", opts: ["λ = Q · m", "Q = λ · m", "m = Q · λ", "Q = λ / m"], ans: 1 },
            { id: 17, q: "Tính nhiệt lượng Q cần cung cấp để làm nóng chảy 200 g nước đá ở 0 °C. Biết nhiệt nóng chảy riêng của nước đá bằng 3,34·10⁵ J/kg.", opts: ["Q = 6,68 J", "Q = 6,68 kJ", "Q = 66,8 kJ", "Q = 668 kJ"], ans: 2 },
            { id: 18, q: "Trong các đặc điểm sau đây, đặc điểm nào KHÔNG phải là đặc điểm của sự bay hơi?", opts: ["Xảy ra ở bất kì nhiệt độ nào của chất lỏng.", "Xảy ra trên mặt thoáng của chất lỏng.", "Không nhìn thấy được.", "Xảy ra ở một nhiệt độ xác định của chất lỏng."], ans: 3 },
            { id: 19, q: "Tính nhiệt lượng cần cung cấp cho 10 kg nước ở 25 °C chuyển thành hơi ở 100 °C. Cho biết nhiệt dung riêng của nước là 4180 J/kg·K và nhiệt hoá hơi riêng là 2,3·10⁶ J/kg.", opts: ["26,135 · 10⁶ J", "23,135 · 10⁶ J", "3,135 · 10⁶ J", "26,135 · 10³ J"], ans: 0 },
            { id: 20, q: "Công thức tính nhiệt hoá hơi riêng L là:", opts: ["Q = γ · m", "L = Q / m", "Q = L · m", "L = m / Q"], ans: 1 }
        ];

        const dataPart2 = [
            {
                id: 1,
                title: "Khi nói về nhiệt nóng chảy của một vật (chất) thì:",
                items: [
                    { label: "a", text: "Nhiệt nóng chảy của vật rắn là nhiệt lượng cung cấp cho vật rắn để nâng nhiệt độ của vật đến nhiệt độ nóng chảy.", ans: false },
                    { label: "b", text: "Nhiệt nóng chảy riêng có đơn vị Jun/kg (J/kg).", ans: true },
                    { label: "c", text: "Các vật có khối lượng bằng nhau thì có nhiệt nóng chảy như nhau.", ans: false },
                    { label: "d", text: "Nhiệt nóng chảy tỉ lệ thuận với khối lượng của vật rắn.", ans: true }
                ]
            },
            {
                id: 2,
                title: "Trong các phát biểu sau, phát biểu nào đúng/sai khi nói về sự sôi?",
                items: [
                    { label: "a", text: "Nước sôi ở nhiệt độ 100 °C. Nhiệt độ này gọi là nhiệt độ sôi của nước.", ans: true },
                    { label: "b", text: "Trong suốt thời gian sôi, nhiệt độ của nước không thay đổi.", ans: true },
                    { label: "c", text: "Trong suốt thời gian sôi, nhiệt độ của nước tăng dần.", ans: false },
                    { label: "d", text: "Sự sôi là một sự bay hơi đặc biệt xảy ra cả trên mặt thoáng lẫn trong lòng chất lỏng.", ans: true }
                ]
            }
        ];

        const dataPart3 = [
            {
                id: 1,
                q: "Nhiệt lượng cần cung cấp để làm hoá hơi 600g nước ở 100 °C là bao nhiêu kJ? (Biết L_nước = 2,26·10⁶ J/kg).",
                ans: "1356",
                exp: "• m = 600g = 0,6 kg.<br>• Q = m · L = 0,6 · 2,26·10⁶ = 1.356.000 J = <b>1356 kJ</b>."
            },
            {
                id: 2,
                q: "Nhiệt dung riêng của nước là 4200 J/kg·K. Để 500g nước tăng thêm 40 °C thì cần cung cấp nhiệt lượng bằng bao nhiêu Joules (J)?",
                ans: "84000",
                exp: "• m = 500g = 0,5 kg; Δt = 40 °C.<br>• Q = m · c · Δt = 0,5 · 4200 · 40 = <b>84.000 J</b>."
            },
            {
                id: 3,
                q: "Một vật bằng đồng có khối lượng m = 6kg đang ở 25 °C, để vật đạt 75 °C thì cần hấp thụ nhiệt lượng bao nhiêu Joules (J)? (Biết c_đồng = 380 J/kg·K).",
                ans: "114000",
                exp: "• Δt = 75 - 25 = 50 °C.<br>• Q = m · c · Δt = 6 · 380 · 50 = <b>114.000 J</b>."
            },
            {
                id: 4,
                q: "Nhiệt độ tại một thành phố vào mùa đông là 41 °F, ứng với nhiệt độ theo thang Celsius là bao nhiêu °C?",
                ans: "5",
                exp: "• Công thức: t(°C) = [t(°F) - 32] / 1,8<br>• t(°C) = (41 - 32) / 1,8 = 9 / 1,8 = <b>5 °C</b>."
            },
            {
                id: 5,
                q: "Cần cung cấp nhiệt lượng bao nhiêu kJ (làm tròn hàng đơn vị) để làm 400g nước từ 20 °C sôi ở 100 °C và có 20% khối lượng hóa hơi khi sôi? (Cho c = 4190 J/kg·K, L = 2,26·10⁶ J/kg).",
                ans: "315",
                exp: "• Q₁ (nóng lên): 0,4 · 4190 · (100 - 20) = 134.080 J.<br>• m' (hóa hơi 20%): 20% · 0,4 = 0,08 kg.<br>• Q₂ (hóa hơi): 0,08 · 2,26·10⁶ = 180.800 J.<br>• Q = Q₁ + Q₂ = 314.880 J = 314,88 kJ ≈ <b>315 kJ</b>."
            }
        ];

        function init() {
            const p1 = document.getElementById('part1');
            dataPart1.forEach((item) => {
                const labels = ['A', 'B', 'C', 'D'];
                let optsHtml = item.opts.map((opt, i) => `
                    <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                        <input type="radio" name="p1_${item.id}" value="${i}" class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
                        <span class="text-sm font-semibold text-slate-700">${labels[i]}.</span>
                        <span class="text-sm text-slate-700">${opt}</span>
                    </label>
                `).join('');
                p1.innerHTML += `
                    <div id="card_p1_${item.id}" class="p-4 rounded-xl border border-slate-200 bg-white">
                        <p class="font-semibold text-slate-800 text-sm md:text-base mb-3"><span class="text-indigo-600">Câu ${item.id}:</span> ${item.q}</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">${optsHtml}</div>
                        <div id="exp_p1_${item.id}" class="hidden mt-3 p-3 rounded-lg text-xs"></div>
                    </div>`;
            });

            const p2 = document.getElementById('part2');
            dataPart2.forEach((q) => {
                let itemsHtml = q.items.map(item => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <span class="text-sm text-slate-700 font-medium"><b>${item.label})</b> ${item.text}</span>
                        <div class="flex gap-4 shrink-0 font-semibold text-xs">
                            <label class="inline-flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-lg border">
                                <input type="radio" name="p2_${q.id}_${item.label}" value="true" class="text-indigo-600"> ĐÚNG
                            </label>
                            <label class="inline-flex items-center gap-1.5 cursor-pointer bg-white px-3 py-1.5 rounded-lg border">
                                <input type="radio" name="p2_${q.id}_${item.label}" value="false" class="text-indigo-600"> SAI
                            </label>
                        </div>
                    </div>`).join('');
                p2.innerHTML += `
                    <div id="card_p2_${q.id}" class="p-4 rounded-xl border border-slate-200 bg-white space-y-3">
                        <p class="font-semibold text-slate-800 text-sm md:text-base"><span class="text-indigo-600">Câu ${q.id}:</span> ${q.title}</p>
                        <div class="space-y-2">${itemsHtml}</div>
                    </div>`;
            });

            const p3 = document.getElementById('part3');
            dataPart3.forEach(item => {
                p3.innerHTML += `
                    <div id="card_p3_${item.id}" class="p-4 rounded-xl border border-slate-200 bg-white">
                        <p class="font-semibold text-slate-800 text-sm md:text-base mb-3"><span class="text-indigo-600">Câu ${item.id}:</span> ${item.q}</p>
                        <input type="text" name="p3_${item.id}" placeholder="Nhập đáp án số (VD: 1356)..." class="w-full sm:w-64 p-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <div id="exp_p3_${item.id}" class="hidden mt-3 p-3 rounded-lg text-xs"></div>
                    </div>`;
            });
        }

        let time = 45 * 60;
        const timerEl = document.getElementById('timer');
        const timer = setInterval(() => {
            let m = Math.floor(time / 60);
            let s = time % 60;
            timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            if (time <= 0) { clearInterval(timer); submitQuiz(); }
            time--;
        }, 1000);

        function submitQuiz() {
            clearInterval(timer);
            let correctCount = 0;
            const totalQuestions = dataPart1.length + 8 + dataPart3.length;

            dataPart1.forEach(q => {
                const card = document.getElementById(`card_p1_${q.id}`);
                const exp = document.getElementById(`exp_p1_${q.id}`);
                const sel = document.querySelector(`input[name="p1_${q.id}"]:checked`);
                const labels = ['A', 'B', 'C', 'D'];

                if (sel && parseInt(sel.value) === q.ans) {
                    correctCount++;
                    card.className = "p-4 rounded-xl border border-emerald-300 bg-emerald-50/50";
                    exp.className = "mt-3 p-3 rounded-lg text-xs bg-emerald-100/60 border border-emerald-200 text-emerald-800 font-medium";
                    exp.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1"></i> Đúng! Đáp án là <b>${labels[q.ans]}</b>`;
                } else {
                    card.className = "p-4 rounded-xl border border-rose-300 bg-rose-50/50";
                    exp.className = "mt-3 p-3 rounded-lg text-xs bg-rose-100/60 border border-rose-200 text-rose-800 font-medium";
                    exp.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 mr-1"></i> Sai. Đáp án đúng là <b>${labels[q.ans]}: ${q.opts[q.ans]}</b>`;
                }
                exp.classList.remove('hidden');
            });

            dataPart2.forEach(q => {
                q.items.forEach(item => {
                    const sel = document.querySelector(`input[name="p2_${q.id}_${item.label}"]:checked`);
                    if (sel && (sel.value === "true") === item.ans) correctCount++;
                });
            });

            dataPart3.forEach(q => {
                const card = document.getElementById(`card_p3_${q.id}`);
                const input = document.querySelector(`input[name="p3_${q.id}"]`);
                const exp = document.getElementById(`exp_p3_${q.id}`);
                const userAns = input ? input.value.trim() : "";

                if (userAns === q.ans) {
                    correctCount++;
                    card.className = "p-4 rounded-xl border border-emerald-300 bg-emerald-50/50";
                    exp.className = "mt-3 p-3 rounded-lg text-xs bg-emerald-100/60 border border-emerald-200 text-emerald-800";
                    exp.innerHTML = `<p class="font-bold text-emerald-700 mb-1"><i class="fa-solid fa-circle-check"></i> Chính xác! Đáp án = ${q.ans}</p>${q.exp}`;
                } else {
                    card.className = "p-4 rounded-xl border border-rose-300 bg-rose-50/50";
                    exp.className = "mt-3 p-3 rounded-lg text-xs bg-rose-100/60 border border-rose-200 text-rose-800";
                    exp.innerHTML = `<p class="font-bold text-rose-700 mb-1"><i class="fa-solid fa-circle-xmark"></i> Chưa đúng. Đáp án đúng = ${q.ans}</p>${q.exp}`;
                }
                exp.classList.remove('hidden');
            });

            const score = ((correctCount / totalQuestions) * 10).toFixed(1);
            document.getElementById('resultBanner').classList.remove('hidden');
            document.getElementById('scoreDisplay').innerText = `${score} / 10`;
            document.getElementById('scoreDetail').innerText = `Đúng ${correctCount} / ${totalQuestions} ý`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = init;
    </script>
</body>
</html>
